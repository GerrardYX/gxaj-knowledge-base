name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'          # 打标签时自动构建，如 git tag v1.0.0
  workflow_dispatch:  # 支持手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache GGUF model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: vendor/models
          key: model-${{ hashFiles('scripts/download-bundles.js') }}
          restore-keys: |
            model-

      - name: Remove broken lockfile & install
        run: |
          rm -f package-lock.json
          npm install --omit=optional
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"

      - name: Download GGUF model (if not cached)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: node scripts/download-bundles.js --platform windows --arch amd64

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
