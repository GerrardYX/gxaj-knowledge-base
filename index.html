<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GXAJ智能问答知识库</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>
  <!-- ========== 主应用 ========== -->
  <div id="appContainer" class="app-container active">
    <!-- 1. 侧边栏 (左) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon gxaj-logo" style="font-size:28px;">🐼</span>
          <div class="logo-text">
            <span class="name">GXAJ智能问答知识库</span>
            <span class="role">智能问答系统</span>
          </div>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">功能</div>
          <div class="nav-item active" id="newChatBtn">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span>新建对话</span>
          </div>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">对话历史</div>
          <div id="conversationHistory" class="conversation-history">
            <div class="history-empty">
              <span>暂无历史对话</span>
            </div>
          </div>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">帮助</div>
          <div class="nav-item" onclick="alert('📖 使用说明：\n\n1. 点击右侧「知识库」图标上传文档\n2. 支持 Word (.docx) 和 Markdown (.md) 格式\n3. 上传完成后直接开始提问\n4. 引用标签可点击查看原文')">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </span>
            <span>使用帮助</span>
          </div>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="app-info">
          <div class="app-version">v2.0 (UX+IndexedDB)</div>
        </div>
      </div>
    </aside>
    
    <!-- 2. 主内容区 (中) -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="chat-header">
        <div class="header-left">
          <button id="mobileMenuBtn" class="mobile-menu-btn" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2>智能问答</h2>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle" title="切换主题">
            <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div id="connectionStatus" class="connection-status">
            <span class="status-dot"></span>
            <span class="status-text">就绪</span>
          </div>
          <button class="icon-btn" id="knowledgeToggleBtn" title="管理知识库">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </button>
          <button class="icon-btn" id="perfModeToggle" title="低性能模式（关闭动画/模糊/阴影）">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </button>
        </div>
      </header>
      
      <!-- 聊天区域 -->
      <div id="chatArea" class="chat-area">
        <!-- 欢迎区域 -->
        <div id="welcomeArea" class="chat-welcome">
          <div class="welcome-icon">
            <span>🐼</span>
          </div>
          <h3>欢迎使用 gxaj知识库</h3>
          <p>我是您的本地智能助理。您可以直接提问，或点击右侧图标管理知识库文档。</p>
        </div>
        
        <!-- 消息列表 -->
        <div id="messageList" class="message-list"></div>
      </div>

      <!-- 检索状态气泡（可视化检索过程） -->
      <div id="searchStatusBubble" class="search-status-bubble hidden">
        <div class="search-status-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <div class="search-status-body">
          <span id="searchStatusText" class="search-status-text">正在检索知识库...</span>
          <div id="searchStatusDetail" class="search-status-detail"></div>
        </div>
      </div>
      
      <!-- 输入区域 -->
      <div id="inputArea" class="input-area">
        <div class="input-container">
          <div id="stopGenerationContainer" class="stop-generation-container hidden">
            <button id="stopGenerationBtn" class="btn btn-secondary btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              停止生成
            </button>
          </div>
          <div class="input-wrapper">
              <textarea 
                id="messageInput" 
                placeholder="输入问题..."
                rows="1"
                autofocus
              ></textarea>
            <div class="input-actions">
              <button id="sendBtn" class="send-btn" title="发送">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="input-hint">
            💡 本地模型驱动 · 知识库问答
          </div>
        </div>
      </div>
    </main>

    <!-- 3. 知识库侧边面板 (右) -->
    <aside id="knowledgePanel" class="knowledge-sidebar">
      <div class="sidebar-header">
        <h3>知识库管理</h3>
        <button class="icon-btn-sm" id="closeKnowledgePanel" title="收起">✕</button>
      </div>
      
      <div class="sidebar-content">
        <!-- 上传区域 -->
        <div id="uploadZone" class="upload-zone-compact">
          <div class="upload-icon-sm">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <p>拖拽或点击上传</p>
          <input type="file" id="fileInput" accept=".docx,.md,.markdown" multiple style="display: none;">
        </div>
        
        <!-- 上传进度 -->
        <div id="uploadProgress" class="upload-progress-compact">
          <div class="upload-progress-header">
            <span class="upload-progress-percent">0%</span>
          </div>
          <div class="upload-progress-bar">
            <div id="uploadProgressFill" class="upload-progress-fill" style="width:0%"></div>
          </div>
        </div>
        
        <!-- 文档列表 -->
        <div class="file-list-header">
          <span>我的文档</span>
          <button id="clearKnowledgeBtn" class="text-btn-sm">清空</button>
        </div>
        <div id="fileList" class="file-list-compact">
          <div class="empty-state">暂无文档</div>
        </div>

        <!-- 文档预览区（点击文件名后显示） -->
        <div id="docPreviewArea" class="doc-preview-area hidden">
          <div class="doc-preview-header">
            <span id="docPreviewTitle" class="doc-preview-title">文档预览</span>
            <button class="icon-btn-sm" onclick="closeDocPreview()">✕</button>
          </div>
          <div id="docPreviewContent" class="doc-preview-content"></div>
        </div>
      </div>

      <div class="sidebar-footer-actions">
        <button class="btn btn-secondary btn-full" id="exportKnowledgeBtn">📦 导出知识库</button>
      </div>
    </aside>
  </div>

  <!-- ========== 加载遮罩 ========== -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text">加载中...</div>
    </div>
  </div>

  <!-- ========== 本地模型加载进度 ========== -->
  <div id="ollama-progress" class="ollama-progress hidden">
    <div class="ollama-progress-header">
      <span class="ollama-progress-icon" style="font-size:16px;">🐼</span>
      <span class="ollama-progress-label">正在加载AI模型：<strong id="model-name"></strong></span>
    </div>
    <div class="ollama-progress-bar">
      <div id="progress-fill" class="ollama-progress-fill"></div>
    </div>
    <div class="ollama-progress-footer">
      <span id="progress-text" class="ollama-progress-text">准备中...</span>
      <span id="progress-status" class="ollama-progress-status"></span>
    </div>
  </div>

  <!-- ========== Toast 容器 ========== -->
  <div id="toastContainer" class="toast-container"></div>
  
  <!-- ========== 移动端侧边栏遮罩 ========== -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- ========== 来源引用弹窗 ========== -->
  <div id="sourceRefModal" class="source-ref-modal hidden">
    <div class="source-ref-modal-overlay" onclick="closeSourceRefModal()"></div>
    <div class="source-ref-modal-content">
      <div class="source-ref-modal-header">
        <span id="sourceRefTitle" class="source-ref-modal-title">来源原文</span>
        <button class="icon-btn-sm" onclick="closeSourceRefModal()">✕</button>
      </div>
      <div id="sourceRefBody" class="source-ref-modal-body"></div>
      <div id="sourceRefFooter" class="source-ref-modal-footer">
        <span id="sourceRefMeta" class="source-ref-meta"></span>
      </div>
    </div>
  </div>

  <!-- 脚本 -->
  <!-- 新增 IndexedDB 存储模块（必须在 app.js 之前） -->
  <script src="js/db.js?v=3.0"></script>
  <script src="js/api.js?v=2.1"></script>
  <script src="js/parser.js?v=2.1"></script>
  <script src="js/embeddings.js?v=2.1"></script>
  <script src="js/app.js?v=3.0"></script>
</body>
</html>
